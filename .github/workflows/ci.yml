name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Los adaptadores se prueban contra servidores de verdad: los dobles no
    # ejecutan el ON CONFLICT ni el script Lua, y ahi vivia un bug de tipos
    # que solo aparecio corriendo Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: orchestati
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Corre sin credenciales: el backend mock ejercita todas las capas, y los
      # pisos de accuracy del clasificador y del ruteo van adentro de la suite.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Los tests importan de src/ con rutas relativas, asi que no dicen nada
      # sobre si el paquete publicado es consumible. Esto lo instala de verdad.
      - name: Verificar el paquete publicable
        run: pnpm verify:package

      # Informativo: deja los numeros en el log de cada corrida, para poder ver
      # cuando una regresion empezo aunque siga por encima del piso.
      - name: Evaluación
        run: |
          pnpm eval
          pnpm eval b
          pnpm eval:routing
          pnpm table
