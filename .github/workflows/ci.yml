name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Corre sin credenciales: el backend mock ejercita todas las capas, y los
      # pisos de accuracy del clasificador y del ruteo van adentro de la suite.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Informativo: deja los numeros en el log de cada corrida, para poder ver
      # cuando una regresion empezo aunque siga por encima del piso.
      - name: Evaluación
        run: |
          pnpm eval
          pnpm eval b
          pnpm eval:routing
          pnpm table
